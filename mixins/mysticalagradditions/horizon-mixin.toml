[mod]
id = "mysticalagradditions"
version = "0.1.0"
priority = 100

[compatibility]
horizon_revision = "1d63e0a5a37a7a708eb0b32b49bf0dfeb28ed8a9"

# The pure tier-6 crop rules (the six-crop table, the crux gate, the tier-6
# drops and the insanium-farmland drop), injected as
# `crate::game::mysticalagradditions`.
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagradditions"
source = "runtime.rs"

# Game-side glue: the level reads the crux gate and bone-meal answers need, and
# the broken-crop drop stacks.
[[module]]
id = "state"
file = "crates/horizon-client/src/game.rs"
name = "mysticalagradditions_state"
source = "support.rs"

# The content half is inside this bundle (`data/mysticalagradditions-content.hmod`, the
# built `content/mysticalagradditions.hmod`): this writes it to `.horizon-cache/` and
# appends it to the dev-mod list, so one `.hnmod` installs the crops, their items and the
# code. The registry keeps one file per project, so a split port could not be listed; AE2
# ships the same pattern.
[[injection]]
id = "embedded-content"
kind = "HEAD"
cancellable = true
target = "horizon_client::game::mods::content_root"
helper = "embedded_content.rs"
bindings = [
  { name = "root", ty = "&std::path::Path", value = "root" },
  { name = "enabled", ty = "&std::collections::BTreeSet<String>", value = "enabled" },
  { name = "dev", ty = "&[std::path::PathBuf]", value = "dev" },
]

# A broken tier-6 crop drops the jar's essence and seeds, not the rolled
# content table's fallback (upstream `MysticalCropBlock.getDrops`).
[[injection]]
id = "loot-drops"
hook = "loot_drops"
hook_version = 1
kind = "HEAD"
helper = "loot_drops.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "context", ty = "&crate::game::native_hooks::NativeLootDrops<'_>", value = "context" },
  { name = "drops", ty = "&mut Vec<horizon_client::items::ItemStack>", value = "drops" },
]

# A tier-6 crop grows through the wheat template only while its crux stands two
# blocks below the crop (upstream `MysticalCropBlock.canGrow`); otherwise the
# template's own random tick is skipped.
[[injection]]
id = "random-tick"
hook = "random_tick"
hook_version = 1
kind = "HEAD"
helper = "random_tick.rs"
bindings = [
  { name = "level", ty = "&mut crate::game::GameLevel<'_>", value = "&mut *self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "handled", ty = "&mut bool", value = "handled" },
]

# Bone meal takes a tier-6 crop only when it could grow (crux present) and is
# under age 7, as upstream's `isValidBonemealTarget`.
[[injection]]
id = "bonemeal-target"
hook = "is_valid_bonemeal_target"
hook_version = 1
kind = "HEAD"
helper = "bonemeal_target.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "pos", ty = "BlockPos", value = "pos" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "valid", ty = "&mut Option<bool>", value = "valid" },
]

# `isBonemealSuccess` is always false: a meal on a tier-6 crop never grows it.
[[injection]]
id = "bonemeal-success"
hook = "is_bonemeal_success"
hook_version = 1
kind = "HEAD"
helper = "bonemeal_success.rs"
bindings = [
  { name = "level", ty = "&crate::game::GameLevel<'_>", value = "self" },
  { name = "state", ty = "BlockStateId", value = "state" },
  { name = "success", ty = "&mut bool", value = "success" },
]
